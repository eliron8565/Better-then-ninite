name: Real Windows Install Smoke Test

# Real install test on a disposable hosted Windows VM; never on a contributor's PC.
# This job intentionally does not publish/replace AppForge downloads.
on:
  push:
    branches: [ main ]
    paths:
      - 'src/AppForgeInstaller/**'
      - '.github/workflows/test-real-install.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  winget-real-install:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Prepare app icon required by the Windows project
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $bitmap=[System.Drawing.Bitmap]::new(32,32)
          $graphics=[System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.Clear([System.Drawing.Color]::Navy)
          $icon=[System.Drawing.Icon]::FromHandle($bitmap.GetHicon())
          $stream=[System.IO.File]::Create('src/AppForgeInstaller/appforge.ico')
          try { $icon.Save($stream) } finally { $stream.Close(); $icon.Dispose(); $graphics.Dispose(); $bitmap.Dispose() }
      - name: Build the AppForge EXE from the same source as the release
        shell: pwsh
        run: |
          dotnet publish src/AppForgeInstaller/AppForgeInstaller.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o smoke-publish
          if($LASTEXITCODE -ne 0){throw 'AppForge build failed'}
      - name: Confirm Winget is ready
        shell: pwsh
        run: |
          if(-not (Get-Command winget -ErrorAction SilentlyContinue)){
            Write-Host 'Bootstrapping Winget on disposable Windows VM using official Microsoft module.'
            Install-Module Microsoft.WinGet.Client -Repository PSGallery -Force -Scope CurrentUser
            Repair-WinGetPackageManager -Latest -Force
            $link=Join-Path $env:LOCALAPPDATA 'Microsoft\WinGet\Links'
            if(Test-Path $link){$env:PATH="$link;$env:PATH"}
          }
          winget --version
          if($LASTEXITCODE -ne 0){throw 'Winget is unavailable; no real installation verified.'}
          winget source update --name winget --disable-interactivity
          if($LASTEXITCODE -ne 0){throw 'Winget source update failed.'}
      - name: Actually install Helix with AppForge and verify the installed package
        shell: pwsh
        env:
          APPFORGE_CI_REAL_INSTALL: YES
        run: |
          $exe=(Resolve-Path 'smoke-publish/AppForge.exe').Path
          $proc=Start-Process -FilePath $exe -ArgumentList '--real-install-smoke' -Wait -PassThru
          Write-Host "AppForge real-install test exit code: $($proc.ExitCode)"
          if($proc.ExitCode -ne 0){throw "Real software installation NOT verified (exit $($proc.ExitCode))."}
          Write-Host 'PASS: AppForge ran a real WinGet install and confirmed the selected app afterwards.'
      - name: Record smoke-test scope
        if: always()
        shell: pwsh
        run: |
          Write-Host 'SCOPE: Helix.Helix real online install on a GitHub-hosted Windows 2025 VM.'
          Write-Host 'NOT COVERED: other software, manual vendor pages, user PC, or post-format migration.'
